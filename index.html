<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Balance</title>
<meta name="theme-color" content="#14201A">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balance">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1E6B4A; --verde-osc: #14503A; --verde-claro: #E3F1E9;
    --fondo: #F4F6F5; --tinta: #14201A; --gris: #56635C; --borde: #DCE3DF;
    --ambar-fondo: #FDF1E3; --ambar: #8A3F07; --rojo: #B3261E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif; background: var(--fondo); color: var(--tinta);
    display: flex; flex-direction: column; -webkit-text-size-adjust: 100%;
  }
  header { background: var(--tinta); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 16px 16px; }
  header .mes { margin: 0; font-size: 13px; color: #B9C7BF; text-transform: capitalize; }
  header h1 { margin: 2px 0 10px; font-size: 22px; letter-spacing: -0.01em; }
  header .total { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: #B9C7BF; }
  header .total b { font-family: 'DM Mono', monospace; font-size: 22px; color: #F2B66D; font-weight: 500; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .yo { align-self: flex-end; max-width: 80%; background: var(--verde); color: #fff; padding: 10px 14px; border-radius: 18px 18px 4px 18px; font-size: 15px; }
  .yo img { display: block; max-width: 180px; border-radius: 10px; }
  .bot { align-self: flex-start; width: 92%; background: #fff; border: 1px solid var(--borde); border-radius: 18px 18px 18px 4px; padding: 12px 14px; font-size: 14px; }
  .bot.simple { width: auto; max-width: 85%; }
  .ok { color: var(--verde); font-weight: 600; }
  .error { color: var(--rojo); }
  .aviso { background: var(--ambar-fondo); color: var(--ambar); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 8px; }
  .campos { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 10px; align-items: center; }
  .campos label { color: var(--gris); font-size: 13px; }
  .campos input, .campos select {
    width: 100%; min-height: 40px; border: 1px solid var(--borde); border-radius: 10px; padding: 0 10px;
    font: inherit; font-size: 15px; background: var(--fondo); color: var(--tinta);
  }
  .campos input.monto { font-family: 'DM Mono', monospace; }
  .botones { display: flex; gap: 8px; margin-top: 12px; }
  .botones button { flex: 1; }
  button { min-height: 44px; border-radius: 12px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; }
  .primario { background: var(--verde); color: #fff; border: none; }
  .secundario { background: #fff; color: var(--tinta); border: 1px solid var(--borde); }
  button:disabled { opacity: .5; }
  .ultimos { list-style: none; margin: 0; padding: 0; }
  .ultimos li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #EDF1EF; font-size: 13px; }
  .ultimos li:last-child { border-bottom: none; }
  .ultimos .m { font-family: 'DM Mono', monospace; white-space: nowrap; }
  .ultimos .d { color: var(--gris); }
  footer { background: #fff; border-top: 1px solid var(--borde); padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: center; }
  .icono { width: 44px; height: 44px; min-height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; }
  .icono.camara, .icono.galeria { background: var(--verde-claro); color: var(--verde); }
  .icono.enviar { background: var(--verde); color: #fff; }
  #texto { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--borde); border-radius: 22px; padding: 0 16px; font: inherit; font-size: 16px; background: var(--fondo); color: var(--tinta); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .pensando { color: var(--gris); font-style: italic; }
  .opciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opciones button { flex: 1 1 calc(50% - 8px); background: var(--verde-claro); color: var(--verde-osc); border: 1px solid #BFDCCB; }
  .opciones button.quitar { flex-basis: 100%; background: #fff; color: var(--gris); border-color: var(--borde); font-weight: 500; }
  .opciones button:disabled { opacity: .45; }
  .resumen { color: var(--gris); font-size: 13px; margin-top: 4px; }
  .velo { position: fixed; inset: 0; background: rgba(20, 32, 26, .55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h2 { margin: 0 0 8px; font-size: 18px; color: var(--ambar); }
  .modal p { margin: 0 0 6px; font-size: 15px; line-height: 1.4; }
  .modal .existente { background: var(--ambar-fondo); color: var(--ambar); border-radius: 10px; padding: 10px; font-size: 14px; margin: 10px 0 14px; }
  .modal .botones { flex-direction: column; }
  .deshacer { background: none; border: none; color: var(--verde); text-decoration: underline; font-weight: 600; min-height: 32px; padding: 0 4px; font-size: 14px; }
  .acceso input { width: 100%; height: 48px; border: 1px solid var(--borde); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; margin: 6px 0 12px; background: var(--fondo); }
  .acceso .error { font-size: 14px; margin-bottom: 8px; }
  .destino { display: none; background: var(--verde-claro); color: var(--verde-osc); border: 1px solid #BFDCCB; border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .destino.ingreso { background: #FFF6E5; color: #7A4B00; border-color: #F1DDB4; }
  .sello { display: flex; align-items: center; gap: 8px; margin: -12px -14px 12px; padding: 9px 14px; border-radius: 18px 18px 0 0;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--verde); }
  .sello::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #9FE0BC; }
  .sello.personal { background: #1F5FAD; }
  .sello.personal::before { background: #A9CBF5; }
  .tarjeta-personal .primario { background: #1F5FAD; }
  .tarjeta-personal .campos select:focus, .tarjeta-personal .campos input:focus { outline-color: #1F5FAD; }
  .chip-personal { display: inline-block; background: #E6EEF9; color: #1F5FAD; border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 700; }
  /* ---------- Inicio, inventario y pedidos ---------- */
  .titulo-btn { background: none; border: none; color: #fff; padding: 0; min-height: 0; display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 10px; text-align: left; }
  .titulo-btn h1 { margin: 0; }
  .titulo-btn svg { opacity: .7; }
  .vista { position: fixed; inset: 0; z-index: 5; background: var(--fondo); display: flex; flex-direction: column; }
  .vista[hidden] { display: none; }
  .v-top { display: flex; align-items: center; gap: 4px; background: #fff; border-bottom: 1px solid var(--borde); padding: calc(8px + env(safe-area-inset-top)) 12px 8px 4px; min-height: 60px; }
  .v-top .v-tit { flex: 1; min-width: 0; }
  .v-top h2 { margin: 0; font-size: 19px; }
  .v-top p { margin: 0; font-size: 12px; color: var(--gris); }
  .v-atras { width: 44px; height: 44px; background: none; border: none; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--tinta); flex-shrink: 0; }
  .v-cuerpo { flex: 1; overflow-y: auto; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
  .v-cuerpo > * { flex-shrink: 0; }
  .v-pie { background: #fff; border-top: 1px solid var(--borde); padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
  .v-pie button, .v-pie a { flex: 1; }
  .v-cuerpo h3 { margin: 6px 0 0; font-size: 15px; }
  .nota { margin: 0; font-size: 13px; color: var(--gris); line-height: 1.45; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 18px; overflow: hidden; }
  .fila { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: none; border-bottom: 1px solid #EDF1EF; background: none; width: 100%; text-align: left; font: inherit; color: inherit; min-height: 0; border-radius: 0; font-weight: 400; }
  .tarjeta > .fila:last-child { border-bottom: none; }
  .crece { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .fuerte { font-weight: 600; font-size: 15px; }
  .sub { font-size: 12px; color: var(--gris); }
  .grupo { padding: 10px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--gris); background: #EDF1EF; }
  .etq { align-self: flex-start; display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
  .etq.ok { background: var(--verde-claro); color: var(--verde-osc); } .etq.av { background: var(--ambar-fondo); color: var(--ambar); } .etq.mal { background: #FBE7E4; color: #9B2C1F; } .etq.gr { background: #EDF1EF; color: var(--gris); }
  .mesnav { display: flex; align-items: center; justify-content: space-between; }
  .mesnav b { font-size: 17px; text-transform: capitalize; }
  .mesnav button { width: 44px; background: #fff; border: 1px solid var(--borde); color: var(--tinta); font-size: 20px; padding: 0; }
  .heroe { background: var(--tinta); color: #fff; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .heroe .lbl { font-size: 13px; color: #B9C7BF; }
  .heroe .grande { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500; color: #8FE0B3; letter-spacing: -.02em; }
  .heroe .grande.neg { color: #F2A69B; }
  .heroe .dos { display: flex; justify-content: space-between; gap: 12px; }
  .heroe .dos b { display: block; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 16px; }
  .barra { height: 8px; border-radius: 4px; background: #22302A; overflow: hidden; } .barra i { display: block; height: 100%; background: #F2B66D; border-radius: 4px; }
  .tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tres > div { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tres b { font-size: 16px; font-family: 'DM Mono', monospace; font-weight: 500; overflow-wrap: anywhere; } .tres span { font-size: 11px; color: var(--gris); }
  .neg { color: #9B2C1F; }
  .mini { height: 5px; border-radius: 3px; background: #EDF1EF; margin-top: 4px; } .mini i { display: block; height: 100%; border-radius: 3px; background: var(--verde); } .mini i.bajo { background: #9B2C1F; }
  .areas-tab { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EDF1EF; border-radius: 12px; }
  .areas-tab button { min-height: 38px; border: none; border-radius: 9px; background: transparent; font-size: 13px; color: var(--gris); padding: 0; }
  .areas-tab button[aria-pressed="true"] { background: #fff; color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .cnt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; min-width: 56px; }
  .cnt b { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; } .cnt span { font-size: 11px; font-weight: 600; color: var(--gris); }
  .cnt.bajo b, .cnt.bajo span { color: #9B2C1F; }
  .area-btn { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; border: 1px solid var(--borde); background: #fff; text-align: left; width: 100%; min-height: 92px; color: var(--tinta); font-weight: 400; }
  .area-btn .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--verde-claro); color: var(--verde-osc); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .area-btn b { font-size: 20px; }
  .accion3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 14px 14px; }
  .accion3 button { font-size: 14px; padding: 0 6px; }
  .chk { width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--borde); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; }
  .hecho .chk { background: var(--verde); border-color: var(--verde); color: #fff; }
  .paso { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .paso button { width: 50px; height: 50px; min-height: 50px; border-radius: 14px; border: none; background: var(--verde-claro); color: var(--verde-osc); font-size: 26px; padding: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .paso .val { min-width: 52px; text-align: center; font-family: 'DM Mono', monospace; font-size: 21px; }
  .paso .val.vacio { color: var(--gris); }
  .paso.chico button { width: 36px; height: 36px; min-height: 36px; font-size: 19px; border-radius: 10px; }
  .paso.chico .val { min-width: 30px; font-size: 16px; }
  .val.botellas { min-width: 90px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--verde-osc); font-family: 'DM Sans', sans-serif; }
  .val.botellas.vacio { color: var(--gris); }
  .bt-fila { display: flex; align-items: flex-end; justify-content: center; gap: 3px; font-size: 13px; font-weight: 700; }
  .bt-cap { font-size: 11px; font-weight: 600; color: var(--gris); white-space: nowrap; min-height: 14px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; }
  .seg button { height: 50px; min-width: 70px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--borde); background: #fff; color: var(--gris); font-size: 15px; }
  .seg button[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .seg button.no[aria-pressed="true"] { background: #B3261E; border-color: #B3261E; }
  .primario.incompleto { background: #EDF1EF; color: var(--gris); border: 1px solid var(--borde); }
  .fila.destello { animation: destello 1.4s ease-out; } @keyframes destello { 0%, 40% { background: var(--ambar-fondo); } 100% { background: transparent; } }
  .wa { background: #1DAA61; color: #fff; border: none; display: flex; align-items: center; justify-content: center; text-decoration: none; min-height: 44px; border-radius: 12px; font-weight: 600; font-size: 15px; }
  .ord { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; padding: 6px 8px; border-radius: 12px; background: #EDF1EF; }
  .hoja-velo { position: fixed; inset: 0; z-index: 20; background: rgba(20, 32, 26, .5); display: flex; align-items: flex-end; }
  .hoja { width: 100%; max-height: 90%; overflow-y: auto; background: #fff; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  .hoja h2 { margin: 0; font-size: 18px; }
  .hoja > button { flex-shrink: 0; }
  .campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .campo[hidden] { display: none; }
  .campo label { font-size: 12px; color: var(--gris); font-weight: 500; }
  .campo input, .campo select { height: 46px; border: 1px solid var(--borde); border-radius: 10px; padding: 0 12px; background: var(--fondo); font: inherit; font-size: 16px; color: var(--tinta); width: 100%; }
  .rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
  .burbuja-wa { background: #EFE7DE; border-radius: 16px; padding: 14px; } .burbuja-wa div { background: #D9FDD3; border-radius: 12px 12px 4px 12px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; line-height: 1.45; margin-left: 10%; }
  .tostada { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 30; background: var(--tinta); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .cargando { color: var(--gris); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <p class="mes" id="mes">&nbsp;</p>
  <button type="button" class="titulo-btn" id="abrirInicio" aria-label="Abrir resumen del mes e inventario"><h1>Vila Paraiso</h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="total"><span>Gastos del mes</span><b id="totalMes">—</b></div>
</header>

<main id="chat" aria-live="polite">
  <div class="bot simple">Escribe un gasto en cualquier orden (<i>“1/10 ferretería 4985 efectivo”</i>) o toca la cámara para fotografiar un recibo (o la galería para elegir varios). Para un gasto tuyo escribe <b>personal</b> (<i>“personal super 12 mil tarjeta”</i>). Si falta algo, te pregunto antes de guardar.</div>
</main>

<footer>
  <label class="icono camara" for="foto" aria-label="Tomar foto del recibo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
  </label>
  <input id="foto" class="sr" type="file" accept="image/*" capture="environment">
  <label class="icono galeria" for="galeria" aria-label="Elegir varias fotos de la galería">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
  </label>
  <input id="galeria" class="sr" type="file" accept="image/*" multiple>
  <label for="texto" class="sr">Describe el gasto</label>
  <input id="texto" type="text" placeholder="Ej: 35 mil carne, tarjeta" autocomplete="off" enterkeyhint="send">
  <button class="icono enviar" id="enviar" aria-label="Enviar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</footer>

<section id="vista" class="vista" hidden></section>

<script>
  var CONF = { categorias: [], pagos: [], hoy: '' };
  var chat = document.getElementById('chat');
  var colon = function (n) { return '₡' + Math.round(n).toLocaleString('es-CR'); };
  var pendiente = null;   // gasto al que le falta un dato: { b, extra, campo, fin }
  var cola = Promise.resolve();
  var LIMITE_FOTO_MS = 30000;   // si la IA no lee la foto en 30 s, se pregunta a mano

  function conLimite(promesa, ms) {
    return new Promise(function (ok, mal) {
      var t = setTimeout(function () { var e = new Error('tiempo'); e.tiempo = true; mal(e); }, ms);
      promesa.then(function (v) { clearTimeout(t); ok(v); }, function (e) { clearTimeout(t); mal(e); });
    });
  }

  /* ---------- Conexión con el motor (Apps Script) ---------- */
  function leerCodigo() { try { return localStorage.getItem('codigo_acceso') || ''; } catch (e) { return ''; } }
  function guardarCodigo(c) { try { localStorage.setItem('codigo_acceso', c); } catch (e) {} }
  var CODIGO = leerCodigo();

  function servidor(fn, arg) {
    return fetch(window.API_URL, {
      method: 'POST',
      redirect: 'follow',
      body: JSON.stringify({ token: CODIGO, accion: fn, datos: arg || null })
    }).then(function (r) {
      if (!r.ok) throw new Error('Sin conexión con el motor (' + r.status + ').');
      return r.json();
    }, function () {
      throw new Error('Sin conexión. Revisa el internet e intenta de nuevo.');
    }).then(function (j) {
      if (!j.ok) {
        if (/código de acceso/i.test(j.error || '')) pedirCodigo(j.error);
        throw new Error(j.error || 'Error');
      }
      return j.resultado;
    });
  }

  /** Primera vez (o si el código cambia): pide el código de acceso y lo guarda en este teléfono. */
  function pedirCodigo(error) {
    if (document.getElementById('acceso')) return;
    var velo = document.createElement('div');
    velo.className = 'velo';
    velo.id = 'acceso';
    velo.innerHTML = '<form class="modal acceso"><h2 style="color:var(--tinta)">Código de acceso</h2>' +
      '<p>Escribe el código que guardaste en Apps Script (APP_TOKEN). Se pide una sola vez en este teléfono.</p>' +
      (error && leerCodigo() ? '<div class="error">El código guardado no funciona. Escríbelo de nuevo.</div>' : '') +
      '<label for="codigo" class="sr">Código</label><input id="codigo" type="password" autocomplete="current-password" required>' +
      '<div class="botones"><button class="primario" type="submit">Entrar</button></div></form>';
    document.body.appendChild(velo);
    velo.querySelector('form').onsubmit = function (e) {
      e.preventDefault();
      CODIGO = velo.querySelector('#codigo').value.trim();
      guardarCodigo(CODIGO);
      velo.remove();
      cargarInicio();
    };
    velo.querySelector('#codigo').focus();
  }
  function burbuja(clase, html) {
    var d = document.createElement('div');
    d.className = clase;
    if (html instanceof Node) d.appendChild(html); else d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fechaBonita(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

  function cargarInicio() {
    servidor('getInicio').then(function (r) {
      CONF = r;
      document.getElementById('mes').textContent = r.mes;
      document.getElementById('totalMes').textContent = colon(r.totalMes);
      if (r.ultimos.length && !document.getElementById('lista-ultimos')) {
        burbuja('bot', '<b>Últimos registros</b><ul class="ultimos" id="lista-ultimos">' + r.ultimos.map(function (u) {
          return '<li><span>' + esc(u.descripcion || u.categoria) + ' <span class="d">· ' + esc(u.fecha) + '</span></span><span class="m">' + colon(u.monto) + '</span></li>';
        }).join('') + '</ul>');
      }
    }).catch(function (e) { burbuja('bot simple error', esc(e.message)); });
  }
  function cargarTotal() {
    servidor('getInicio').then(function (r) { document.getElementById('totalMes').textContent = colon(r.totalMes); });
  }

  /* ---------- Preguntar lo que falta ---------- */

  var PREGUNTAS = {
    monto: { texto: 'Monto?', opciones: [] },
    fecha: { texto: 'Fecha?', opciones: ['Hoy', 'Ayer', 'Otra fecha'] },
    pago: { texto: 'Tipo de pago?', opciones: ['Tarjeta', 'Efectivo', 'SINPE', 'Transferencia'] },
    descripcion: { texto: '¿Dónde fue la compra o qué compraste?', opciones: [] },
    rubro: { texto: 'Fila del Balance?', opciones: [] }
  };

  function esIngreso(rubro) {
    return (CONF.rubros || []).some(function (r) { return r.nombre === rubro && r.ingreso; });
  }

  function faltante(b) {
    if (b.rubros && b.rubros.length && !b.rubro) return 'rubro';
    if (!b.monto) return 'monto';
    if (!b.fecha && !(b.rubro && b.mes)) return 'fecha';   // fila del Balance con periodo dicho: la fecha no importa
    if (!b.pago && !b.rubro) return 'pago';   // las filas del Balance no piden tipo de pago
    if (!b.descripcion && !b.rubro) return 'descripcion';
    return null;
  }

  /** Pregunta lo que falte; cuando está completo muestra la tarjeta. Devuelve una promesa que termina al guardar o descartar. */
  function siguientePaso(b, extra, fin) {
    var campo = faltante(b);
    if (!campo) { pendiente = null; tarjeta(b, extra, fin); return; }
    var q = PREGUNTAS[campo];
    var caja = document.createElement('div');
    pendiente = { b: b, extra: extra, campo: campo, fin: fin, caja: caja };
    var hecho = [];
    if (b.personal) hecho.push('<span class="chip-personal">Personal</span>');
    if (b.rubro) hecho.push('Balance: ' + esc(b.rubro.trim()));
    else if (b.descripcion) hecho.push(esc(b.descripcion));
    if (b.monto) hecho.push(b.moneda === 'USD' ? 'US$' + b.monto : colon(b.monto));
    if (b.fecha) hecho.push(fechaBonita(b.fecha));
    if (b.pago) hecho.push(esc(b.pago));
    caja.innerHTML = (b.nota ? '<div class="aviso">' + esc(b.nota) + '</div>' : '') +
      '<div>' + q.texto + '</div>' +
      (hecho.length ? '<div class="resumen">Tengo: ' + hecho.join(' · ') + '</div>' : '') +
      '<div class="opciones">' + (campo === 'rubro' ? b.rubros : q.opciones).map(function (o) { return '<button type="button">' + o + '</button>'; }).join('') +
      '<button type="button" class="quitar">Cancelar este gasto</button></div>';
    b.nota = '';
    burbuja('bot', caja);
    caja.querySelectorAll('.opciones button').forEach(function (btn) {
      btn.onclick = function () {
        caja.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
        if (btn.textContent === 'Otra fecha') { otraFecha(caja, b, extra, fin); return; }
        if (btn.classList.contains('quitar')) {
          pendiente = null; burbuja('bot simple', 'Gasto cancelado.'); if (fin) fin(); return;
        }
        responder(btn.textContent);
      };
    });
    if (!q.opciones.length) document.getElementById('texto').focus();
  }

  /** "Otra fecha": calendario para elegirla */
  function otraFecha(caja, b, extra, fin) {
    var zona = document.createElement('div');
    zona.className = 'opciones';
    zona.innerHTML = '<input type="date" aria-label="Fecha" max="' + (CONF.hoy || '') + '" style="flex:1;min-width:0;font-size:16px;padding:8px">' +
      '<button type="button" class="primario">OK</button>';
    caja.appendChild(zona);
    var entrada = zona.querySelector('input'), ok = zona.querySelector('button');
    if (entrada.showPicker) { try { entrada.showPicker(); } catch (e) {} } else entrada.focus();
    ok.onclick = function () {
      if (!entrada.value) { entrada.focus(); return; }
      ok.disabled = entrada.disabled = true;
      burbuja('yo', fechaBonita(entrada.value));
      b.fecha = entrada.value;
      siguientePaso(b, extra, fin);
    };
  }

  /** Respuesta a la pregunta pendiente: se lee y se completa solo lo que faltaba. */
  function responder(t) {
    var p = pendiente;
    if (!p) return;
    burbuja('yo', esc(t));
    p.caja.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
    var b = p.b;
    if (p.campo === 'pago') {
      var elegido = CONF.pagos.filter(function (x) { return x.toLowerCase() === t.trim().toLowerCase(); })[0];
      if (elegido) { b.pago = elegido; siguientePaso(b, p.extra, p.fin); return; }
    }
    if (p.campo === 'descripcion') { b.descripcion = t.trim(); siguientePaso(b, p.extra, p.fin); return; }
    if (p.campo === 'rubro') {
      var r = (b.rubros || []).filter(function (x) { return x.trim().toLowerCase() === t.trim().toLowerCase(); })[0];
      if (r) { b.rubro = r; siguientePaso(b, p.extra, p.fin); return; }
    }
    var espera = burbuja('bot simple pensando', '…');
    servidor('interpretar', { texto: t }).then(function (r) {
      espera.remove();
      if (!b.monto && r.monto) b.monto = r.monto;
      if (!b.fecha && r.fecha) b.fecha = r.fecha;
      if (!b.pago && r.pago) b.pago = r.pago;
      if (!b.mes && r.mes) b.mes = r.mes;
      if (!b.descripcion && r.descripcion) { b.descripcion = r.descripcion; b.categoria = r.categoria; }
      if (faltante(b) === p.campo) b.nota = 'No entendí. ' + (p.campo === 'monto' ? 'Escribe solo el número, ej. 4985.' : p.campo === 'fecha' ? 'Escribe la fecha como 1/10.' : '');
      siguientePaso(b, p.extra, p.fin);
    }).catch(function (e) { espera.className = 'bot simple error'; espera.textContent = e.message; });
  }

  /* ---------- Aviso de duplicado (ventana que hay que contestar) ---------- */

  function preguntarDuplicado(existente) {
    return new Promise(function (listo) {
      var velo = document.createElement('div');
      velo.className = 'velo';
      velo.setAttribute('role', 'dialog');
      velo.setAttribute('aria-modal', 'true');
      velo.innerHTML = '<div class="modal"><h2>¿Ya está registrado?</h2>' +
        '<p>Hay un gasto con el mismo monto y fecha parecida:</p>' +
        '<div class="existente">' + esc(existente) + '</div>' +
        '<div class="botones"><button type="button" class="primario">Es el mismo · no guardar</button>' +
        '<button type="button" class="secundario">Es otro gasto · guardar</button></div></div>';
      document.body.appendChild(velo);
      var b = velo.querySelectorAll('button');
      b[0].focus();
      b[0].onclick = function () { velo.remove(); listo(false); };
      b[1].onclick = function () { velo.remove(); listo(true); };
    });
  }

  /* ---------- Tarjeta de confirmación ---------- */

  /** Lista de destinos: categorías del día a día (Data) y filas del Balance. Valor "D|..." o "B|...". */
  function destinos(b) {
    var sel = b.personal ? 'P|' + (b.categoriaPersonal || 'Otros') : b.rubro ? 'B|' + b.rubro : 'D|' + b.categoria;
    var personales = CONF.categoriasPersonales || [];
    var op = function (v, txt) { return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(txt) + '</option>'; };
    var gastos = (CONF.rubros || []).filter(function (r) { return !r.ingreso; });
    var ingresos = (CONF.rubros || []).filter(function (r) { return r.ingreso; });
    return '<optgroup label="Compras del día">' + CONF.categorias.map(function (c) { return op('D|' + c, c); }).join('') + '</optgroup>' +
      (gastos.length ? '<optgroup label="Balance · gastos">' + gastos.map(function (r) { return op('B|' + r.nombre, r.nombre.trim()); }).join('') + '</optgroup>' : '') +
      (ingresos.length ? '<optgroup label="Balance · entradas">' + ingresos.map(function (r) { return op('B|' + r.nombre, r.nombre.trim()); }).join('') + '</optgroup>' : '') +
      (personales.length ? '<optgroup label="Gastos personales">' + personales.map(function (c) { return op('P|' + c, c); }).join('') + '</optgroup>' : '');
  }

  function tarjeta(b, extra, fin) {
    var caja = document.createElement('div');
    var opciones = function (lista, sel) { return lista.map(function (o) { return '<option' + (o === sel ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); };
    var id = 'g' + Date.now() + Math.floor(Math.random() * 1000);
    caja.innerHTML =
      '<div class="sello"></div><div class="destino"></div><div style="margin-bottom:10px"><b class="titulo">¿Guardo este gasto?</b></div>' +
      '<div class="campos">' +
      '<label for="' + id + 'f" class="fila-fecha">Fecha</label><input id="' + id + 'f" class="fila-fecha" type="date" value="' + esc(b.fecha || (b.rubro && b.mes ? CONF.hoy : '')) + '">' +
      '<label for="' + id + 'm">Monto ' + (b.moneda === 'USD' ? 'US$' : '₡') + '</label><input id="' + id + 'm" class="monto" type="number" inputmode="numeric" value="' + esc(b.monto) + '">' +
      '<label for="' + id + 'd">Descripción</label><input id="' + id + 'd" type="text" value="' + esc(b.descripcion) + '">' +
      '<label for="' + id + 'c">Va a</label><select id="' + id + 'c">' + destinos(b) + '</select>' +
      '<label for="' + id + 'x" class="fila-mes">Periodo</label><select id="' + id + 'x" class="fila-mes">' +
        ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre']
          .map(function (m, i) { return '<option value="' + (i + 1) + '">' + m + '</option>'; }).join('') + '</select>' +
      '<label for="' + id + 'p" class="fila-pago">Pago</label><select class="fila-pago" id="' + id + 'p">' + (b.pago ? '' : '<option value="">—</option>') + opciones(CONF.pagos, b.pago) + '</select>' +
      '</div>' +
      '<div class="botones"><button class="primario">Guardar</button><button class="secundario">Descartar</button></div>';
    var burb = burbuja('bot', caja);
    var btns = caja.querySelectorAll('.botones button');
    // El tipo de pago solo aplica a compras del día (Data), no a filas del Balance
    var selDestino = caja.querySelector('#' + id + 'c');
    var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    var aviso = caja.querySelector('.destino'), titulo = caja.querySelector('.titulo');
    var selMes = caja.querySelector('#' + id + 'x'), mesTocado = false;
    selMes.onchange = function () { mesTocado = true; mostrarPago(); };
    var mesAnterior = function (rubro) { return (CONF.rubros || []).some(function (r) { return r.nombre === rubro && r.mesAnterior; }); };
    var sello = caja.querySelector('.sello');
    var mostrarPago = function () {
      var balance = selDestino.value.indexOf('B|') === 0;
      var personal = selDestino.value.indexOf('P|') === 0;
      sello.textContent = personal ? 'Gastos personales' : 'Vila Paraíso';
      sello.className = 'sello' + (personal ? ' personal' : '');
      burb.classList.toggle('tarjeta-personal', personal);
      caja.querySelectorAll('.fila-pago').forEach(function (el) { el.style.display = balance ? 'none' : ''; });
      caja.querySelectorAll('.fila-mes').forEach(function (el) { el.style.display = balance ? '' : 'none'; });
      caja.querySelectorAll('.fila-fecha').forEach(function (el) { el.style.display = balance ? 'none' : ''; });
      if (balance) {
        var rubro = selDestino.value.slice(2), fila = rubro.trim(), ingreso = esIngreso(rubro);
        var f = caja.querySelector('#' + id + 'f').value;
        if (!mesTocado && f) {
          // Mes sugerido: el que se dijo en el chat; si la fila se paga atrasada (agua, luz…), el mes anterior a la fecha
          var m = Number(f.split('-')[1]);
          var sugerido = b.mes || (mesAnterior(rubro) ? (m === 1 ? 12 : m - 1) : m);
          selMes.value = String(sugerido);
        }
        aviso.textContent = (ingreso ? 'Entrada' : 'Gasto fijo') + ' → Balance · ' + fila + ' · Periodo ' + MESES[Number(selMes.value) - 1].toLowerCase();
        aviso.className = 'destino' + (ingreso ? ' ingreso' : '');
        aviso.style.display = 'block';
        titulo.textContent = ingreso ? '¿Guardo esta entrada?' : '¿Guardo este gasto fijo?';
      } else {
        aviso.style.display = 'none';
        titulo.textContent = personal ? '¿Guardo este gasto personal?' : '¿Guardo este gasto?';
      }
    };
    selDestino.onchange = mostrarPago;
    caja.querySelector('#' + id + 'f').onchange = mostrarPago;
    mostrarPago();
    var valor = function (s) { return caja.querySelector('#' + id + s).value; };
    var terminar = function () { if (fin) { var f = fin; fin = null; f(); } };

    function guardar(forzar) {
      if (!valor('f') || !Number(valor('m'))) { alertaCampos(); return; }
      if (valor('c').indexOf('B|') !== 0 && !valor('p')) { alertaCampos('Falta el tipo de pago.'); return; }
      btns[0].disabled = btns[1].disabled = true;
      btns[0].textContent = 'Guardando…';
      var dest = valor('c'), enBalance = dest.indexOf('B|') === 0, enPersonal = dest.indexOf('P|') === 0;
      servidor('guardarGasto', {
        fecha: valor('f'), monto: valor('m'), descripcion: valor('d'), pago: enBalance ? '' : valor('p'), moneda: b.moneda || 'CRC', personal: enPersonal,
        categoria: enBalance ? '' : dest.slice(2), rubro: enBalance ? dest.slice(2) : '', mes: enBalance ? Number(valor('x')) : 0,
        forzar: !!forzar   // la foto no se guarda: solo se usa para leer los datos
      }).then(function (r) {
        if (r.duplicado) {
          btns[0].textContent = 'Guardar';
          preguntarDuplicado(r.existente).then(function (esOtro) {
            if (esOtro) { guardar(true); return; }
            burb.innerHTML = '<span class="d">No guardado: ya estaba registrado.</span>';
            burb.classList.add('simple');
            terminar();
          });
          return;
        }
        var monto = b.moneda === 'USD' ? 'US$' + valor('m') : colon(valor('m'));
        var resumen = r.destino === 'Balance'
          ? 'Balance · ' + esc(r.rubro) + ' · ' + esc(r.mes) + ' · ' + monto
          : r.destino === 'Personal'
          ? '<span class="chip-personal">Personal</span> ' + esc(valor('d') || r.categoria) + ' · ' + esc(r.categoria) + ' · ' + monto + ' · ' + fechaBonita(valor('f')) + ' · ' + esc(valor('p'))
          : esc(valor('d') || valor('c').slice(2)) + ' · ' + monto + ' · ' + fechaBonita(valor('f')) + ' · ' + esc(valor('p'));
        burb.innerHTML = '<span class="ok">✓ Guardado</span> · ' + resumen + ' <button type="button" class="deshacer">Deshacer</button>';
        burb.classList.add('simple');
        burb.querySelector('.deshacer').onclick = function () {
          this.disabled = true; this.textContent = 'Borrando…';
          servidor('deshacerGasto', { destino: r.destino, fila: r.fila, marca: r.marca }).then(function () {
            burb.innerHTML = '<span class="d">Borrado · ' + resumen + '</span>';
            cargarTotal();
          }).catch(function (e) { burbuja('bot simple error', esc(e.message)); });
        };
        cargarTotal();
        terminar();
      }).catch(function (e) {
        btns[0].disabled = btns[1].disabled = false;
        btns[0].textContent = 'Reintentar';
        burbuja('bot simple error', esc(e.message));
      });
    }
    function alertaCampos(texto) {
      var av = document.createElement('div');
      av.className = 'aviso';
      av.textContent = texto || 'Falta la fecha o el monto.';
      caja.insertBefore(av, caja.firstChild);
    }
    btns[0].onclick = function () { guardar(false); };
    btns[1].onclick = function () { burb.innerHTML = '<span class="d">Descartado</span>'; burb.classList.add('simple'); terminar(); };
  }

  /* ---------- Texto ---------- */

  function enviarTexto() {
    var campo = document.getElementById('texto');
    var t = campo.value.trim();
    if (!t) return;
    campo.value = '';
    if (pendiente) { responder(t); return; }
    burbuja('yo', esc(t));
    var espera = burbuja('bot simple pensando', 'Leyendo…');
    servidor('interpretar', { texto: t }).then(function (b) { espera.remove(); siguientePaso(b, null, null); })
      .catch(function (e) { espera.className = 'bot simple error'; espera.textContent = e.message; });
  }
  document.getElementById('enviar').onclick = enviarTexto;
  document.getElementById('texto').addEventListener('keydown', function (e) { if (e.key === 'Enter') enviarTexto(); });

  /* ---------- Fotos: una por una; la siguiente empieza cuando terminas la anterior ---------- */

  function reducir(archivo) {
    return new Promise(function (ok, mal) {
      var lector = new FileReader();
      lector.onerror = mal;
      lector.onload = function () {
        var img = new Image();
        img.onerror = function () { mal(new Error('No pude abrir esa imagen.')); };
        img.onload = function () {
          var max = 1200, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          var url = c.toDataURL('image/jpeg', 0.7);
          ok({ url: url, base64: url.split(',')[1] });
        };
        img.src = lector.result;
      };
      lector.readAsDataURL(archivo);
    });
  }

  function alElegirFotos(e) {
    var archivos = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    archivos.forEach(function (archivo, i) {
      cola = cola.then(function () {
        return reducir(archivo).then(function (r) {
          burbuja('yo', '<img src="' + r.url + '" alt="Recibo">' + (archivos.length > 1 ? '<div style="font-size:12px;margin-top:4px">Foto ' + (i + 1) + ' de ' + archivos.length + '</div>' : ''));
          var espera = burbuja('bot simple pensando', 'Leyendo el recibo…');
          var extra = { foto: r.base64, mime: 'image/jpeg' };
          return conLimite(servidor('interpretar', extra), LIMITE_FOTO_MS).then(function (b) {
            espera.remove();
            return new Promise(function (listo) { siguientePaso(b, extra, listo); });
          }).catch(function (err) {
            // Si la IA tarda más del límite o falla: se piden los datos a mano (la foto se guarda igual)
            espera.remove();
            var vacio = { fecha: '', monto: 0, descripcion: '', categoria: 'Insumos Alimenticios', pago: '',
              nota: err && err.tiempo ? 'No pude leer la foto a tiempo. Te pregunto los datos.' : 'No pude leer la foto. Te pregunto los datos.' };
            return new Promise(function (listo) { siguientePaso(vacio, extra, listo); });
          });
        }).catch(function (err) { burbuja('bot simple error', esc(err.message)); });
      });
    });
  }
  document.getElementById('foto').addEventListener('change', alElegirFotos);
  document.getElementById('galeria').addEventListener('change', alElegirFotos);

  /* =================== INICIO, INVENTARIO Y PEDIDOS =================== */
  /* Se abre tocando "Vila Paraiso" arriba. El chat sigue siendo la pantalla principal. */

  var vista = document.getElementById('vista');
  var INV = null, RESUMEN = {}, pila = [], pedidoExtra = {}, enviados = {};
  var QUIEN = 'Rodrigo';
  var SVG = function (p, t) { return '<svg width="' + (t || 22) + '" height="' + (t || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; };
  var IC = {
    atras: SVG('<path d="M15 5l-7 7 7 7"/>'), sig: SVG('<path d="M9 5l7 7-7 7"/>', 18),
    check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',

  VISTAS.contar = function (a) {
    if (necesitaInv('Contar')) return;
    var area = a.area, its = delArea(area), b = leerBorrador(area);
    var hechos = its.filter(function (it) { return b.c[it.id] != null; }).length;
    marco(area, '<span id="progreso">' + hechos + ' de ' + its.length + ' contados</span>',
      '<div class="tarjeta">' + conGrupos(its, function (it) { return filaContar(it, b.c[it.id]); }) + '</div>' +
      '<p class="nota">Mantén presionado + para contar rápido.' + (its.some(function (it) { return it.como === 'Botellas'; }) ? ' En las botellas cada toque suma o resta ¼.' : '') + ' Si no hay ninguno, toca − para marcar 0.</p>',
      '<button type="button" class="primario' + (hechos < its.length ? ' incompleto' : '') + '" id="btn-enviar" data-v="enviar-conteo" data-a="' + area + '">Enviar</button>');
  };
  function marcarContado(area, id) {
    var its = delArea(area), b = leerBorrador(area), hechos = its.filter(function (it) { return b.c[it.id] != null; }).length;
    var r = document.getElementById('r-' + id); if (r) r.classList.add('hecho');
    var p = document.getElementById('progreso'); if (p) p.textContent = hechos + ' de ' + its.length + ' contados';
    var e = document.getElementById('btn-enviar'); if (e) e.classList.toggle('incompleto', hechos < its.length);
  }
  function sumar(id, d) {
    var area = pila[pila.length - 1].a.area, it = INV.items.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    var b = leerBorrador(area), c = b.c[id];
    c = c == null ? (d > 0 ? (it.como === 'Botellas' ? it.paso : 1) : 0) : Math.max(0, Math.round((c + d * it.paso) * 100) / 100);
    b.c[id] = c; guardarBorrador(area, b);
    var v = document.getElementById('v-' + id);
    if (v) { if (it.como === 'Botellas') v.innerHTML = botellasHTML(c); else v.textContent = num(c); v.classList.remove('vacio'); }
    marcarContado(area, id);
  }
  function hayFalta(id, n) {
    var area = pila[pila.length - 1].a.area, b = leerBorrador(area);
    b.c[id] = n; guardarBorrador(area, b);
    vista.querySelectorAll('[data-v="hf"][data-a="' + id + '"]').forEach(function (x) { x.setAttribute('aria-pressed', Number(x.dataset.n) === n); });
    marcarContado(area, id);
  }
  function enviarConteo(area, btn) {
    var its = delArea(area), b = leerBorrador(area);
    var faltan = its.filter(function (it) { return b.c[it.id] == null; });
    if (faltan.length) {
      abrirHoja('<h2>' + (faltan.length === 1 ? 'Falta 1 por contar' : 'Faltan ' + faltan.length + ' por contar') + '</h2><p class="nota">Cuenta todos los productos de ' + area + ' para poder enviar.</p>' +
        '<button type="button" class="primario" data-v="ir-faltante" data-a="' + esc(faltan[0].id) + '">Ir al primero</button>');
      return;
    }
    btn.disabled = true; btn.textContent = 'Guardando…';
    servidor('guardarConteo', { area: area, quien: QUIEN, conteos: b.c }).then(function (r) {
      INV = r.inventario; borrarBorrador(area); pedidoExtra = {};
      reemplazar('listo', { area: area, bajos: r.bajos, total: r.total });
    }).catch(function (e) { btn.disabled = false; btn.textContent = 'Enviar'; tostada(e.message); });
  }
  VISTAS.listo = function (a) {
    marco('Conteo guardado', a.area,
      '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 0 8px"><span style="width:76px;height:76px;border-radius:38px;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center">' + IC.check.replace(/14/g, '36') + '</span>' +
      '<b style="font-size:20px">' + a.total + ' productos contados</b><span class="sub">El inventario de ' + a.area + ' ya está al día en la hoja.</span></div>' +
      (a.bajos.length ? '<h3>Bajo el mínimo (' + a.bajos.length + ')</h3><div class="tarjeta">' + a.bajos.map(function (n) { return '<div class="fila"><span class="fuerte" style="font-size:14px">' + esc(n) + '</span></div>'; }).join('') + '</div>' : '<p class="nota" style="text-align:center">Nada quedó bajo el mínimo.</p>'),
      (a.bajos.length ? '<button type="button" class="primario" data-v="cambiar" data-a="pedidos">Ver pedidos</button>' : '<button type="button" class="secundario" data-v="atras">Listo</button>'));
  };

  /* ---------- Pedidos ---------- */
  function lineasPedido() {
    var g = {};
    INV.items.forEach(function (it) { var q = aPedir(it); if (q > 0) (g[it.prov] = g[it.prov] || []).push({ it: it, q: q }); });
    var orden = INV.proveedores.map(function (p) { return p.nombre; });
    return Object.keys(g).sort(function (x, y) { var a = orden.indexOf(x), b = orden.indexOf(y); return (a < 0 ? 99 : a) - (b < 0 ? 99 : b); }).map(function (k) { return { p: provDe(k), lineas: g[k] }; });
  }
  function mensajePedido(p, lineas) {
    var ls = lineas.map(function (l) { return l.it.como === 'Hay o falta' ? '• ' + l.it.nombre : '• ' + l.it.nombre + ': ' + num(l.q) + ' ' + pideTxt(l.it, l.q); }).join('\n');
    if (p.tipo === 'Cocina') return 'Para preparar · Vila Paraíso\n\n' + ls;
    if (p.tipo === 'Lista') return 'Lista de compras · Vila Paraíso\n\n' + ls;
    return 'Hola, buen día. Pedido de Vila Paraíso:\n\n' + ls + '\n\n' + (p.entrega ? 'Entrega: ' + p.entrega + '. ' : '') + '¡Muchas gracias!';
  }
  function enlaceWA(p, texto) {
    var n = String(p.wa || '').replace(/\D/g, '');
    if (n.length === 8) n = '506' + n;
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
  }
  VISTAS.pedidos = function () {
    if (necesitaInv('Pedidos')) return;
    var grupos = lineasPedido();
    marco('Pedidos', 'Según el último conteo',
      (grupos.length ? grupos.map(function (g) {
        var p = g.p, tot = g.lineas.reduce(function (t, l) { return t + l.q * l.it.precio; }, 0), falta = p.min && tot ? p.min - tot : 0;
        var info = [p.tipo === 'Cocina' ? 'Para preparar en cocina' : p.tipo === 'Lista' ? 'Lista de compras' : '', p.entrega ? 'Entrega ' + esc(p.entrega) : '', p.min ? 'mínimo ' + colon(p.min) : '', p.tipo === 'WhatsApp' && !p.wa ? 'sin WhatsApp: eliges el contacto al enviar' : ''].filter(Boolean).join(' · ');
        var texto = mensajePedido(p, g.lineas), clave = p.nombre;
        return '<div class="tarjeta"><div class="fila"><div class="crece"><span class="fuerte" style="font-size:16px">' + esc(p.nombre) + '</span>' + (info ? '<span class="sub">' + info + '</span>' : '') + '</div>' + (enviados[clave] ? '<span class="etq ok">Enviado ✓</span>' : '') + '</div>' +
          g.lineas.map(function (l) {
            var hf = l.it.como === 'Hay o falta';
            return '<div class="fila"><div class="crece"><span class="fuerte" style="font-size:14px">' + esc(l.it.nombre) + '</span><span class="sub">' + (hf ? 'Comprar' : pideTxt(l.it, l.q)) + (l.it.precio ? ' · ' + colon(l.q * l.it.precio) : '') + ' · hay ' + verValor(l.it, l.it.hay) + '</span></div>' +
              (hf ? '<button type="button" class="secundario" style="padding:0 12px" data-v="ord" data-a="' + esc(l.it.id) + '" data-q="1" data-d="-1">Quitar</button>'
                : '<div class="paso chico"><button type="button" data-v="ord" data-a="' + esc(l.it.id) + '" data-q="' + l.q + '" data-d="-1" aria-label="Menos">−</button><span class="val">' + num(l.q) + '</span><button type="button" data-v="ord" data-a="' + esc(l.it.id) + '" data-q="' + l.q + '" data-d="1" aria-label="Más">+</button></div>') + '</div>';
          }).join('') +
          '<div class="fila" style="flex-direction:column;align-items:stretch;gap:10px">' +
          (tot ? '<div style="display:flex;justify-content:space-between"><span class="sub">Total aproximado</span><b style="font-family:\'DM Mono\',monospace">' + colon(tot) + '</b></div>' : '') +
          (falta > 0 ? '<div class="aviso" style="margin:0">Faltan ' + colon(falta) + ' para el pedido mínimo.</div>' : '') +
          (p.tipo === 'WhatsApp'
            ? '<a class="wa" href="' + enlaceWA(p, texto) + '" target="_blank" rel="noopener" data-v="wa" data-a="' + esc(clave) + '">' + (enviados[clave] ? 'Abrir WhatsApp otra vez' : 'Enviar por WhatsApp') + '</a>'
            : '<button type="button" class="wa" data-v="compartir" data-a="' + esc(clave) + '">' + (p.tipo === 'Cocina' ? 'Compartir con cocina' : 'Compartir lista') + '</button>') +
          '</div></div>';
      }).join('') : '<div class="tarjeta"><div class="fila" style="border:0"><div class="crece"><span class="fuerte">No hay nada por pedir</span><span class="sub">Todo está sobre el mínimo según el último conteo.</span></div></div></div>') +
      '<p class="nota">Las cantidades llevan lo que hay de vuelta al máximo. Cámbialas con − y + antes de enviar. Los mensajes van sin precios.</p>');
  };
  function compartir(clave) {
    var g = lineasPedido().filter(function (x) { return x.p.nombre === clave; })[0];
    if (!g) return;
    var texto = mensajePedido(g.p, g.lineas);
    var hecho = function () { enviados[clave] = true; pintar(); };
    if (navigator.share) navigator.share({ text: texto }).then(hecho).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(texto).then(function () { tostada('Lista copiada'); hecho(); });
  }

  /* ---------- Proveedores ---------- */
  VISTAS.proveedores = function () {
    if (necesitaInv('Proveedores')) return;
    marco('Proveedores', 'A quién se le pide cada cosa',
      '<div class="tarjeta">' + INV.proveedores.map(function (p) {
        var n = INV.items.filter(function (it) { return it.prov === p.nombre; }).length;
        return '<button type="button" class="fila" data-v="proveedor" data-a="' + esc(p.nombre) + '"><div class="crece"><span class="fuerte">' + esc(p.nombre) + '</span>' +
          '<span class="sub">' + (p.tipo === 'Cocina' ? 'Se prepara en cocina' : p.tipo === 'Lista' ? 'Lista de compras' : p.wa ? 'WhatsApp ' + esc(p.wa) : '<span style="color:var(--ambar);font-weight:600">Falta el WhatsApp</span>') + ' · ' + n + (n === 1 ? ' producto' : ' productos') + '</span>' +
          '<span class="sub">' + (p.min ? 'Pedido mínimo ' + colon(p.min) : 'Sin pedido mínimo') + (p.entrega ? ' · entrega ' + esc(p.entrega) : '') + '</span></div>' + IC.sig + '</button>';
      }).join('') + '</div>', '',
      '<button type="button" class="primario" style="padding:0 14px" data-v="proveedor" data-a="">+ Agregar</button>');
  };
  function hojaProveedor(nombre) {
    var p = INV.proveedores.filter(function (x) { return x.nombre === nombre; })[0] || { nombre: '', wa: '', min: '', entrega: '', tipo: 'WhatsApp' };
    var op = function (v, t) { return '<option value="' + v + '"' + (v === p.tipo ? ' selected' : '') + '>' + t + '</option>'; };
    abrirHoja('<h2>' + (p.nombre ? 'Editar proveedor' : 'Nuevo proveedor') + '</h2>' +
      '<div class="campo"><label for="v-nombre">Nombre</label><input id="v-nombre" value="' + esc(p.nombre) + '"></div>' +
      '<div class="campo"><label for="v-tipo">Cómo se le pide</label><select id="v-tipo">' + op('WhatsApp', 'Por WhatsApp') + op('Lista', 'Lista de compras (súper)') + op('Cocina', 'Se prepara en cocina') + '</select></div>' +
      '<div class="campo"><label for="v-wa">WhatsApp</label><input id="v-wa" inputmode="tel" value="' + esc(p.wa) + '" placeholder="8888 8888"></div>' +
      '<div class="rejilla"><div class="campo"><label for="v-min">Pedido mínimo (₡)</label><input id="v-min" inputmode="numeric" value="' + esc(p.min || '') + '"></div>' +
      '<div class="campo"><label for="v-ent">Días de entrega</label><input id="v-ent" value="' + esc(p.entrega) + '" placeholder="martes y viernes"></div></div>' +
      '<div class="aviso" id="v-error" hidden></div>' +
      '<div class="botones"><button type="button" class="secundario" data-v="cerrar">Cancelar</button><button type="button" class="primario" data-v="guardar-prov" data-a="' + esc(p.nombre) + '">Guardar</button></div>');
  }
  function guardarProveedor(antes, btn) {
    var h = document.querySelector('.hoja'), v = function (k) { return h.querySelector('#v-' + k).value.trim(); }, err = h.querySelector('#v-error');
    if (!v('nombre')) { err.textContent = 'Falta el nombre.'; err.hidden = false; return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    servidor('guardarProveedor', { antes: antes, nombre: v('nombre'), wa: v('wa'), min: v('min'), entrega: v('ent'), tipo: v('tipo') })
      .then(function (r) { INV = r.inventario; cerrarHoja(); pintar(); tostada('Proveedor guardado'); })
      .catch(function (e) { btn.disabled = false; btn.textContent = 'Guardar'; err.textContent = e.message; err.hidden = false; });
  }

  /* ---------- Toques ---------- */
  function alTocar(e) {
    var b = e.target.closest('[data-v]');
    if (!b) return;
    var v = b.dataset.v, a = b.dataset.a;
    switch (v) {
      case 'atras': atras(); break;
      case 'cerrar': cerrarHoja(); break;
      case 'reintentar': RESUMEN = {}; INV = null; pintar(); break;
      case 'ir': abrir(a); break;
      case 'cambiar': reemplazar(a); break;
      case 'mes': { var t = pila[pila.length - 1], r = RESUMEN[t.a.mes || new Date().getMonth() + 1]; t.a.mes = (r ? r.mes : new Date().getMonth() + 1) + Number(b.dataset.d); pintar(true); break; }
      case 'area': pila[pila.length - 1].a.area = a; pintar(true); break;
      case 'producto': hojaProducto(a); break;
      case 'guardar-prod': guardarProducto(a, b); break;
      case 'borrar-prod':
        if (b.dataset.seguro !== '1') { b.dataset.seguro = '1'; b.textContent = '¿Seguro?'; break; }
        b.disabled = true;
        servidor('borrarProducto', { id: a }).then(function (r) { INV = r.inventario; cerrarHoja(); pintar(); tostada('Producto eliminado'); }).catch(function (er) { tostada(er.message); });
        break;
      case 'contar': abrir('contar', { area: a }); break;
      case 'hf': hayFalta(a, Number(b.dataset.n)); break;
      case 'enviar-conteo': enviarConteo(a, b); break;
      case 'ir-faltante': {
        cerrarHoja();
        var fila = document.getElementById('r-' + a);
        if (fila) { fila.scrollIntoView({ behavior: 'smooth', block: 'center' }); fila.classList.remove('destello'); void fila.offsetWidth; fila.classList.add('destello'); }
        break;
      }
      case 'ord': pedidoExtra[a] = Math.max(0, Number(b.dataset.q) + Number(b.dataset.d)); pintar(); break;
      case 'wa': enviados[a] = true; setTimeout(pintar, 400); break;
      case 'compartir': compartir(a); break;
      case 'proveedor': hojaProveedor(a); break;
      case 'guardar-prov': guardarProveedor(a, b); break;
    }
  }
  vista.addEventListener('click', alTocar);

  // Mantener presionado + o − para contar rápido
  var repetir = null, repitio = false;
  function pararRepetir() { if (repetir) { clearTimeout(repetir.t); clearInterval(repetir.i); repetir = null; } }
  vista.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('[data-paso]'); if (!b) return;
    pararRepetir(); repitio = false;
    repetir = { t: setTimeout(function () { repetir.i = setInterval(function () { repitio = true; sumar(b.dataset.a, Number(b.dataset.paso)); }, 110); }, 450) };
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { document.addEventListener(t, pararRepetir); });
  document.addEventListener('scroll', pararRepetir, true);
  vista.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-paso]')) e.preventDefault(); });
  vista.addEventListener('click', function (e) {
    var b = e.target.closest('[data-paso]'); if (!b) return;
    if (repitio) { repitio = false; return; }
    sumar(b.dataset.a, Number(b.dataset.paso));
  });

  document.getElementById('abrirInicio').onclick = function () { if (!pila.length) abrir('resumen'); };

  if (!window.API_URL || /PEGAR/.test(window.API_URL)) {
    burbuja('bot simple error', 'Falta el enlace del motor en config.js.');
  } else if (!CODIGO) { pedirCodigo(); } else { cargarInicio(); }
</script>
</body>
</html>
